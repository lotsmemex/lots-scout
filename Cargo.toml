[workspace]
resolver = "2"
members = ["crates/lots-scout-types", "crates/lots-scout-extract"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lotsmemex/lots-scout"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# dom_smoothie 0.18.0 (MIT, upstream commit 04ffb638) is vendored to make
# equal-score candidate ordering deterministic.
[patch.crates-io]
dom_smoothie = { path = "vendor/dom_smoothie" }
